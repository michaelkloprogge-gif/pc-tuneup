name: Idea
description: Suggest something PC Tune-Up could check, fix or explain better.
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like PC Tune-Up to do, and what problem would it solve for you?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PC Tune-Up version
